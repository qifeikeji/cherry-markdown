name: Build and Package

on:
  push:
    branches: 
      - main
      - master
  pull_request:
    branches: 
      - main
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [build_request]

permissions:
  contents: write
  packages: write

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install Yarn
      run: npm install -g yarn@1.22.22
      
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
      
    - name: Install System Dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev pkg-config build-essential
      
    - name: Build Project
      run: yarn build
      
    - name: Build Client
      run: yarn build:client
      
    - name: Create Release Package
      run: |
        mkdir -p dist
        cp -r packages/cherry-markdown/dist/* dist/
        cp -r packages/client/src-tauri/target/release/* dist/
        cd dist
        zip -r ../cherry-markdown-release.zip .
        ls -la ../cherry-markdown-release.zip
        
    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-release
        path: ${{ github.workspace }}/cherry-markdown-release.zip
        retention-days: 5
        if-no-files-found: error 
